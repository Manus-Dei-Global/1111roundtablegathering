<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MDGIFT | 11:11 Roundtable — A Call to Order</title>
    <meta
      name="description"
      content="Join Manus Dei Global Initiative for Transformation for the 11:11 Roundtable Gathering: A Call to Order. 11 November 2026 in Abuja."
    />
    <meta name="theme-color" content="#0b0b0b" />
    <meta property="og:title" content="11:11 Roundtable — A Call to Order" />
    <meta
      property="og:description"
      content="A prophetic call for revival and order in the Body of Christ. 11 November 2026 | Abuja."
    />
    <meta property="og:type" content="event" />
    <meta
      property="og:image"
      content="./resources/WhatsApp-Image-2026-09-27-at-3.22.29-AM.jpeg"
    />
    <link
      rel="icon"
      href="./resources/ChatGPT-Image-Oct-6-2026-02_31_06-PM.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #333132;
        --gold: #d4a855;
        --deep: #0b0b0b;
        --paper: #f7f7f7;
        --white: #fff;
        --muted: #726f6d;
        --line: rgba(212, 168, 85, 0.34);
        --serif: Georgia, 'Times New Roman', serif;
        --sans: 'Montserrat', Arial, sans-serif;
        --script: 'Times New Roman', 'Nimbus Roman', serif;
        --max: 1180px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 90px;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.75 var(--sans);
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: inherit;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      .wrap {
        width: min(var(--max), calc(100% - 44px));
        margin: auto;
      }
      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--gold);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1,
      h2,
      h3 {
        line-height: 1.15;
      }
      h2 {
        font: 700 clamp(2rem, 4vw, 3.5rem)/1.12 var(--serif);
        color: var(--ink);
        margin-bottom: 18px;
      }
      .section-intro {
        max-width: 720px;
        color: #625e5c;
      }
      .section-head {
        max-width: 770px;
        margin: 0 auto 50px;
        text-align: center;
      }
      .script {
        font-family: var(--script);
        font-weight: 400;
      }
      .gold {
        color: var(--gold);
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 22px;
        border-radius: 2px;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.82rem;
        letter-spacing: 0.06em;
        border: 1px solid var(--gold);
        background: var(--gold);
        color: #292522;
        transition: 0.2s;
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 26px #0002;
      }
      .button.outline {
        background: transparent;
        color: var(--gold);
      }
      .button.light {
        background: transparent;
        border-color: #ffffff80;
        color: white;
      }
      .button.small {
        padding: 11px 16px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--deep);
        border-bottom: 1px solid var(--line);
      }
      .nav {
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        min-width: 290px;
      }
      .brand img {
        width: 290px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 3px 14px #d4a85570);
      }
      .brand-fallback {
        display: none;
        color: white;
        font: 700 1rem var(--serif);
        letter-spacing: 0.02em;
      }
      .brand-fallback b {
        color: var(--gold);
        font:
          900 1.2rem Arial,
          sans-serif;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(12px, 2vw, 28px);
      }
      .nav-links a {
        text-decoration: none;
        color: #f7f4ef;
        font-size: 0.69rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        font-weight: 700;
        white-space: nowrap;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--gold);
      }
